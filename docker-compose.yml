services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greentube
      POSTGRES_USER: greentube
      POSTGRES_PASSWORD: greentube
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greentube"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Data/ is gitignored — bind-mount from the host so the container can read it.
      # The reviewer must have Data/ present locally before running docker compose up.
      - ./Data:/app/Data:ro
    environment:
      DATABASE_URL: postgresql://greentube:greentube@postgres:5432/greentube
      # Replace with a strong secret before any real deployment.
      # The /api/upload endpoint (internal, not KAM-facing) requires this as X-API-Key.
      UPLOAD_API_KEY: ${UPLOAD_API_KEY:-change-me-before-deploying}
      # Restrict CORS to the frontend origin.
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
